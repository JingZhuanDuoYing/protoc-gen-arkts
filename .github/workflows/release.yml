name: Release

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build and upload binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: protoc-gen-arkts
            asset_name: protoc-gen-arkts-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: protoc-gen-arkts
            asset_name: protoc-gen-arkts-macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: protoc-gen-arkts
            asset_name: protoc-gen-arkts-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: protoc-gen-arkts.exe
            asset_name: protoc-gen-arkts-windows-x86_64.exe
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Rust
        run: rustup update stable && rustup target add ${{ matrix.target }}
        
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
        
      - name: Rename binary (Unix)
        if: matrix.os != 'windows-latest'
        run: cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ${{ matrix.asset_name }}
        
      - name: Rename binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ${{ matrix.asset_name }}
          
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: ${{ matrix.asset_name }}
